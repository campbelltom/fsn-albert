name: Update projections

on:
  schedule:
    - cron: "40 */3 * * *"        # every 3 hours; match days can be tightened later
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["fsnmodel/**", "scripts/**", "config/**", "site/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # RFU data (data/rfu/*.json) is committed to the repo: the RFU site refuses GitHub's runners (HTTP 405), so it is
      # scraped from a normal machine with scripts/scrape_rfu.py. ESPN results are cached here between runs.
      - name: Restore scraped data
        uses: actions/cache@v4
        with:
          path: data/espn
          key: fsn-data-${{ github.run_id }}
          restore-keys: fsn-data-
      - name: Restore projection snapshots
        uses: actions/cache@v4
        with:
          path: data/snapshots
          key: fsn-snap-${{ github.run_id }}
          restore-keys: fsn-snap-
      - name: ESPN league ids (for adding more competitions)
        run: python scripts/scrape_espn.py --discover
        continue-on-error: true
      - name: ESPN results (fills anything not in data/rfu)
        run: python scripts/scrape_espn.py --from 2023 --to 2027 --out data/espn
        continue-on-error: true
      - name: Named lineups (ESPN rosters; appear ~48h before kick-off)
        run: python scripts/fetch_lineups.py
        continue-on-error: true
      - name: Run model
        env:
          FSN_SITE_PASSWORD: ${{ secrets.FSN_SITE_PASSWORD }}
        run: |
          set -o pipefail
          python scripts/run_production.py --out _site/data 2>&1 | tee model.log || {
            echo "::error title=Model failed::$(tail -n 25 model.log | tr '\n' '|' | cut -c1-3000)"
            exit 1
          }
      - name: Assemble site
        run: cp site/index.html site/squad.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Evaluation is slow (minutes) and only writes to the log, so it runs beside the deploy instead of holding it up.
  evaluate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore scraped data
        uses: actions/cache/restore@v4
        with:
          path: data/espn
          key: fsn-data-${{ github.run_id }}
          restore-keys: fsn-data-
      - name: Restore projection snapshots
        uses: actions/cache/restore@v4
        with:
          path: data/snapshots
          key: fsn-snap-${{ github.run_id }}
          restore-keys: fsn-snap-
      - name: Backtest and snapshot evaluation (public stats only)
        run: python scripts/backtest.py --competition all --rules config/rules_nc.json
        continue-on-error: true
      - name: Starters by shirt (per-80 profile)
        run: python scripts/role_table.py --rules config/rules_nc.json
        continue-on-error: true
      - name: Compare role models by backtest (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/tune.py --set roles --rules config/rules_nc.json
        continue-on-error: true
        timeout-minutes: 25
      - name: Tune model settings by backtest (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/tune.py --rules config/rules_nc.json
        continue-on-error: true
        timeout-minutes: 25

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
